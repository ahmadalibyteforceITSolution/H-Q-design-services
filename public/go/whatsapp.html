<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting to WhatsApp | H&Q Design Services</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 32px 28px;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #334155;
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 10px;
      font-size: 20px;
      color: #fff;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 20px;
    }
    .btn {
      display: inline-block;
      background: #10b981;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      transition: background 0.2s;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      background: #059669;
    }
  </style>
  <script>
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var phone = (params.get('phone') || '966507143124').replace(/[^0-9]/g, '');
        if (!phone) phone = '966507143124';
        var text = params.get('text');
        var waUrl = 'https://' + 'wa.me/' + phone;
        if (text) {
          waUrl += '?text=' + encodeURIComponent(text);
        }
        window.location.replace(waUrl);
      } catch (e) {
        console.error(e);
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Opening WhatsApp...</h2>
    <p>Connecting you to an H&Q senior architect on WhatsApp for drawings, 3D elevations, and consultation.</p>
    <button id="manualBtn" class="btn" onclick="openWa()">Open WhatsApp Now</button>
  </div>
  <script>
    function openWa() {
      var params = new URLSearchParams(window.location.search);
      var phone = (params.get('phone') || '966507143124').replace(/[^0-9]/g, '');
      if (!phone) phone = '966507143124';
      var text = params.get('text');
      var waUrl = 'https://' + 'wa.me/' + phone;
      if (text) {
        waUrl += '?text=' + encodeURIComponent(text);
      }
      window.location.href = waUrl;
    }
  </script>
</body>
</html>
